    <!--
      Dark mode bootstrap.
      Tailwind is configured with `darkMode: ["class"]`, so its `dark:`
      variants only fire when `<html>` carries a `.dark` class. Without
      this script, system-level `prefers-color-scheme: dark` would only
      flip the CSS custom properties (background, foreground …) but
      every `dark:bg-…` / `dark:border-…` utility would silently no-op,
      leaving white-card surfaces stuck on a dark canvas.
      We sync the class with system preference here, BEFORE any CSS or
      React loads, so the very first paint is correct (no flash).
    -->
    <script>
      (function () {
        try {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var apply = function (isDark) {
            document.documentElement.classList.toggle('dark', isDark);
          };
          apply(mq.matches);
          if (mq.addEventListener) mq.addEventListener('change', function (e) { apply(e.matches); });
          else if (mq.addListener) mq.addListener(function (e) { apply(e.matches); });
        } catch (_) { /* non-fatal: fall back to light theme */ }
      })();
    </script>
